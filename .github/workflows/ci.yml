# Builds ServerAutoDemo on every push, like the InstaGibPlus CI.
# Every build gets its own package name: ServerAutoDemo_<branch>-<commit>, or
# ServerAutoDemo_<tag> for a tag. A push publishes it as a preview release;
# a published release gets the zip attached.
name: CI

on:
  push:
  pull_request:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download 469e Patch
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "OldUnreal/UnrealTournamentPatches"
          tag: "v469e"
          fileName: "OldUnreal-UTPatch469e-Windows-x86.zip"

      - name: Extract Patch
        run: 7z x "OldUnreal-UTPatch469e-Windows-x86.zip"

      - name: Determine Package Name
        run: |
          $ref = "${{ github.ref }}"
          $repoName = "${{ github.event.repository.name }}"
          $sha = "${{ github.sha }}"
          $prever = (Get-Date -UFormat "%Y%m%d%H%M%S")
          if ("${{ github.ref_type }}" -eq "tag") {
            echo ("PKG_NAME="+$repoName+"_"+$ref.SubString(10)) >> $env:GITHUB_ENV
          } elseif ($ref.StartsWith("refs/pull/")) {
            echo ("PKG_NAME="+$repoName+"_pr_"+$ref.SubString(10, $ref.Length - 16)) >> $env:GITHUB_ENV
          } else {
            echo ("PKG_NAME="+$repoName+"_"+$ref.SubString(11)+"-"+$sha.SubString(0,8)) >> $env:GITHUB_ENV
            echo ("PREVIEW_VER="+$ref.SubString(11)+"-"+$prever) >> $env:GITHUB_ENV
          }

      # The package is named after its folder, so the checkout folder is the build's name.
      # The classes name no package, so they need no edits.
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4
        with:
          path: ${{ env.PKG_NAME }}/

      # README: the install steps use the example name ServerAutoDemo_main-1a2b3c4d.
      # In the zip, put this build's name there instead.
      - name: Update README
        run: |
          $Readme = "${{ env.PKG_NAME }}/README.md"
          (Get-Content -Path $Readme -Encoding UTF8) -replace "ServerAutoDemo_main-1a2b3c4d","${{ env.PKG_NAME }}" | Set-Content -Path $Readme -Encoding UTF8

      - name: Extract Necessary Resources
        run: 7z x "${{ env.PKG_NAME }}/Build/BuildEnv.zip"

      - name: Build ${{ env.PKG_NAME }}
        run: "${{ env.PKG_NAME }}/Build.bat silent noint nouz noverinf verbose"

      - name: Save UCC.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ucc-output
          path: System/UCC.log

      - name: Collect Release Files
        run: |
          New-Item -ItemType Directory -Force -Path "Release/System" | Out-Null
          Copy-Item -Path "${{ env.PKG_NAME }}/System/${{ env.PKG_NAME }}.u" -Destination "Release/System" -Verbose
          Copy-Item -Path "${{ env.PKG_NAME }}/README.md" -Destination "Release" -Verbose
          Copy-Item -Path "${{ env.PKG_NAME }}/LICENSE" -Destination "Release" -Verbose

      - name: Save ${{ env.PKG_NAME }} Package
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.PKG_NAME }}"
          path: Release/**/*

      - name: Create Release Asset
        run: |
          cd Release
          7z a -tzip -- "${{ env.PKG_NAME }}.zip" *

      - name: Attach Asset To Release
        if: success() && github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: Release/${{ env.PKG_NAME }}.zip
          overwrite: true

      - name: Create Pre-Release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ServerAutoDemo Preview ${{ env.PREVIEW_VER }}
          prerelease: true
          body: |
            Package: **${{ env.PKG_NAME }}**

            1. Copy `System/${{ env.PKG_NAME }}.u` from the zip into your server's **System** folder.
            2. Stop the server. Under **[Engine.GameEngine]** in **UnrealTournament.ini**, add or update this line:

            ```
            ServerActors=${{ env.PKG_NAME }}.ServerAutoDemo
            ```

            3. Start the server. The settings in ServerAutoDemo.ini stay as they are.
          files: Release/${{ env.PKG_NAME }}.zip
          tag_name: ${{ env.PREVIEW_VER }}
          target_commitish: ${{ github.sha }}
